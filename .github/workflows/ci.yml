name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-interaction --no-progress
      # Offline, via orchestra/testbench; the live smoke test skips itself
      # when LIVETENNISAPI_KEY is not set (see README)
      - run: vendor/bin/phpunit
